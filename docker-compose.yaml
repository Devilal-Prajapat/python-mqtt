services:
  python-ws:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: python-ws

    volumes:
      - .:/workspace

    working_dir: /workspace

    stdin_open: true
    tty: true

    security_opt:
      - seccomp:unconfined

    cap_add:
      - SYS_PTRACE
      - NET_ADMIN

    privileged: true

    network_mode: host